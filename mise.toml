# civil-war-like 用 worktree タスク + Phase 0 ツールチェーン
# • リポジトリルートに mise.toml を配置（未コミットでも wt:*setup が worktree へコピー）。
# • wt:setup / wt:clean … 固定パス ~/my-worktree-civil-war-like（本リポ専用・1 本）
# • wt:setup-append-branch … 既存 experimental 先端から別 path に枝を足す（複数可）
# • wt:setup / wt:clean / wt:setup-append-branch はメインリポジトリ側で実行するのが安全。
# • wt:grok はメインでも worktree でも実行可（固定 path 向け）。
# • htdp 等の ~/my-worktree とは分離（衝突しない）。
#
# Phase 0 ツール（Makefile / vendor fetch なし）:
#   g++  … github:xpack-dev-tools/gcc-xpack@15.2.0-1 (g++ 15.2.0)
#   raylib … github:raysan5/raylib@5.5
# ビルド: mise run deps | compile | build | smoke | clean
# 注: mise 2025.10 系は tool_alias 未対応のため backend フル名で固定。

[tools]
# Phase 0: Linux x64 固定。他 OS は asset_pattern / platforms を足す。
"github:xpack-dev-tools/gcc-xpack" = { version = "15.2.0-1", asset_pattern = "xpack-gcc-*-linux-x64.tar.gz" }
"github:raysan5/raylib" = { version = "5.5", asset_pattern = "raylib-*_linux_amd64.tar.gz" }

[tasks."wt:setup"]
description = "実験用 Git worktree を作成（civil-war 固定パス）"
shell = "bash -c"
run = '''
set -euo pipefail
WORKTREE_DIR="${HOME}/my-worktree-civil-war-like"
MAIN_ROOT="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
MISE_SRC="$MAIN_ROOT/mise.toml"

# デフォルトブランチ（civil-war-like は main）
DEFAULT_BASE="main"
if ! git -C "$MAIN_ROOT" show-ref --verify --quiet "refs/heads/main"; then
  if git -C "$MAIN_ROOT" show-ref --verify --quiet "refs/heads/master"; then
    DEFAULT_BASE="master"
  fi
fi

git -C "$MAIN_ROOT" worktree prune

if [ -e "$WORKTREE_DIR" ]; then
  echo "❌ 既に存在します: $WORKTREE_DIR"
  echo "   先に（メインリポジトリで） mise run wt:clean を実行してください。"
  exit 1
fi

default_branch="experimental/$(date +%Y%m%d)-feat"
read -r -p "branch 名 (default: $default_branch): " branch
branch=${branch:-"$default_branch"}

mkdir -p "$(dirname "$WORKTREE_DIR")"

if git -C "$MAIN_ROOT" show-ref --verify --quiet "refs/heads/$branch"; then
  echo "ℹ️  既存ブランチを利用: $branch"
  git -C "$MAIN_ROOT" worktree add "$WORKTREE_DIR" "$branch"
else
  echo "ℹ️  新規ブランチを作成: $branch (from $DEFAULT_BASE)"
  git -C "$MAIN_ROOT" worktree add -b "$branch" "$WORKTREE_DIR" "$DEFAULT_BASE"
fi

# mise.toml がブランチに無い（未コミット等）場合でも worktree からタスクを使えるようにする
if [ -f "$MISE_SRC" ]; then
  cp -f "$MISE_SRC" "$WORKTREE_DIR/mise.toml"
  echo "ℹ️  mise.toml を worktree にコピーしました"
  (cd "$WORKTREE_DIR" && mise trust mise.toml >/dev/null 2>&1 || true)
fi

echo "✅ worktree 準備完了: $WORKTREE_DIR [$branch]"
echo "   次のどちらか:"
echo "     • メインのまま:  mise run wt:grok"
echo "     • worktree へ:  cd $WORKTREE_DIR && mise run wt:grok"
'''

[tasks."wt:setup-append-branch"]
description = "既存 experimental 先端から新 branch + 別 path worktree を追加"
shell = "bash -c"
run = '''
set -euo pipefail

# メインリポジトリ根を解決（worktree 内からでも common-dir 経由）
if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  MAIN_ROOT="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
else
  echo "❌ git リポジトリ内で実行してください（推奨: ~/my-project/civil-war-like）"
  exit 1
fi

cd "$MAIN_ROOT"
MISE_SRC="$MAIN_ROOT/mise.toml"
# 本リポ専用の固定 path（htdp の ~/my-worktree とは別）
FIXED_WT="${HOME}/my-worktree-civil-war-like"

git -C "$MAIN_ROOT" worktree prune

echo "=== wt:setup-append-branch (civil-war-like) ==="
echo "メイン: $MAIN_ROOT"
echo "既存 worktree:"
git -C "$MAIN_ROOT" worktree list
echo

# --- base branch ---
default_base=""
if [ -d "$FIXED_WT" ] && git -C "$FIXED_WT" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  default_base="$(git -C "$FIXED_WT" rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
fi
if [ -z "$default_base" ] || [ "$default_base" = "master" ] || [ "$default_base" = "main" ]; then
  default_base="$(
    git -C "$MAIN_ROOT" for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/heads/experimental/*' \
      | head -n1
  )"
fi
if [ -z "$default_base" ]; then
  if git -C "$MAIN_ROOT" show-ref --verify --quiet "refs/heads/main"; then
    default_base="main"
  else
    default_base="master"
  fi
fi

echo "ローカル experimental/* ブランチ:"
git -C "$MAIN_ROOT" branch --list 'experimental/*' || true
echo
read -r -p "base branch（分岐元） (default: $default_base): " base
base=${base:-"$default_base"}

if ! git -C "$MAIN_ROOT" show-ref --verify --quiet "refs/heads/$base"; then
  echo "❌ base branch がありません: $base"
  echo "   先にそのブランチを用意するか、正しい名前を指定してください。"
  exit 1
fi

# --- new branch ---
default_suffix="feat"
default_branch="experimental/$(date +%Y%m%d)-${default_suffix}"
read -r -p "新しい branch 名 (default: $default_branch): " branch
branch=${branch:-"$default_branch"}

if git -C "$MAIN_ROOT" show-ref --verify --quiet "refs/heads/$branch"; then
  echo "❌ すでに同名 branch があります: $branch"
  echo "   別名にするか、不要なら branch -D してから再実行してください。"
  exit 1
fi

# --- worktree path（固定 civil-war path とは別）---
# experimental/20260722-feat → ${HOME}/my-worktree-civil-war-like-20260722-feat
slug="${branch#experimental/}"
slug="${slug//\//-}"
default_dir="${HOME}/my-worktree-civil-war-like-${slug}"
read -r -p "worktree パス (default: $default_dir): " WORKTREE_DIR
WORKTREE_DIR=${WORKTREE_DIR:-"$default_dir"}
# 先頭 ~ を HOME に（クォート入力対策）
case "$WORKTREE_DIR" in
  "~/"*) WORKTREE_DIR="${HOME}/${WORKTREE_DIR#~/}" ;;
  "~") WORKTREE_DIR="${HOME}" ;;
esac

if [ "$WORKTREE_DIR" = "$FIXED_WT" ]; then
  echo "❌ 固定 path ($FIXED_WT) は wt:setup 専用です。"
  echo "   別名 path を指定してください（例: $default_dir）。"
  exit 1
fi

if [ -e "$WORKTREE_DIR" ]; then
  echo "❌ 既に存在します: $WORKTREE_DIR"
  exit 1
fi

echo
echo "作成内容:"
echo "  base:     $base ($(git -C "$MAIN_ROOT" rev-parse --short "$base"))"
echo "  branch:   $branch  (新規 -b)"
echo "  path:     $WORKTREE_DIR"
read -r -p "実行しますか？ (y/N): " confirm
if [[ "$confirm" != "y" && "$confirm" != "Y" ]]; then
  echo "キャンセルしました"
  exit 0
fi

mkdir -p "$(dirname "$WORKTREE_DIR")"
echo "ℹ️  git worktree add -b \"$branch\" \"$WORKTREE_DIR\" \"$base\""
git -C "$MAIN_ROOT" worktree add -b "$branch" "$WORKTREE_DIR" "$base"

if [ -f "$MISE_SRC" ]; then
  cp -f "$MISE_SRC" "$WORKTREE_DIR/mise.toml"
  echo "ℹ️  mise.toml を worktree にコピーしました"
  (cd "$WORKTREE_DIR" && mise trust mise.toml >/dev/null 2>&1 || true)
fi

echo
echo "✅ append worktree 準備完了"
echo "   path:   $WORKTREE_DIR"
echo "   branch: $branch  (from $base)"
echo "   作業開始:  cd $WORKTREE_DIR"
echo "   一覧:      git -C $MAIN_ROOT worktree list"
echo "   削除例:    git -C $MAIN_ROOT worktree remove $WORKTREE_DIR"
echo "              git -C $MAIN_ROOT branch -d $branch   # 任意"
'''

[tasks."wt:grok"]
description = "worktree 内で Grok Build 起動（スキル適用）"
shell = "bash -c"
run = '''
set -euo pipefail
WORKTREE_DIR="${HOME}/my-worktree-civil-war-like"

if [ ! -d "$WORKTREE_DIR" ] || ! git -C "$WORKTREE_DIR" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  echo "❌ worktree がありません: $WORKTREE_DIR"
  echo "   先にメインリポジトリで mise run wt:setup を実行してください。"
  exit 1
fi

cd "$WORKTREE_DIR"

# メイン側で起動した場合に備え、最新の mise.toml を同期
MAIN_ROOT="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
if [ -f "$MAIN_ROOT/mise.toml" ]; then
  cp -f "$MAIN_ROOT/mise.toml" "$WORKTREE_DIR/mise.toml"
fi

echo "=== Grok Build (civil-war-like worktree) ==="
echo "cwd: $(pwd)"
git status
echo "メインリポジトリは安全です。この worktree で実験しますか？ (y/N)"
read -r confirm
if [[ "$confirm" != "y" && "$confirm" != "Y" ]]; then
  echo "キャンセルしました（y で続行）"
  exit 0
fi

# 現行 CLI: 対話は grok "<PROMPT>"（-p/--single は単発・非対話）
PROMPT="あなたは git-worktree-experimental スキルを使用中です。
この worktree（固定パス ${WORKTREE_DIR}）上で civil-war-like の実験的な変更を行ってください。
メインリポジトリを直接壊さないこと。作業後は git status で差分を確認すること。"

exec grok --cwd "$WORKTREE_DIR" "$PROMPT"
'''

[tasks."wt:clean"]
description = "実験終了後 worktree を削除（civil-war 固定パスのみ）"
shell = "bash -c"
run = '''
set -euo pipefail
WORKTREE_DIR="${HOME}/my-worktree-civil-war-like"

# worktree 内から実行されてもメインルートを解決する
if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  MAIN_ROOT="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
else
  echo "❌ git リポジトリ内で実行してください（メイン推奨: ~/my-project/civil-war-like）"
  exit 1
fi

# 削除対象 worktree の中にいると remove できないのでメインへ移る
cwd="$(pwd -P)"
if [[ "$cwd" == "$WORKTREE_DIR" || "$cwd" == "$WORKTREE_DIR"/* ]]; then
  cd "$MAIN_ROOT"
fi

branch=""

if git -C "$MAIN_ROOT" worktree list --porcelain | grep -Fxq "worktree $WORKTREE_DIR"; then
  branch="$(git -C "$WORKTREE_DIR" rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
  git -C "$MAIN_ROOT" worktree remove "$WORKTREE_DIR" --force
  echo "✅ worktree を削除しました: $WORKTREE_DIR"
elif [ -e "$WORKTREE_DIR" ]; then
  rm -rf "$WORKTREE_DIR"
  echo "✅ 残骸ディレクトリを削除しました: $WORKTREE_DIR"
else
  echo "ℹ️  worktree は既にありません: $WORKTREE_DIR"
fi

git -C "$MAIN_ROOT" worktree prune

if [ -z "$branch" ]; then
  echo "ローカルブランチ:"
  git -C "$MAIN_ROOT" branch --list 'experimental/*'
  read -r -p "削除する branch 名 (空 Enter でスキップ): " branch
fi

if [ -n "$branch" ] && [ "$branch" != "master" ] && [ "$branch" != "main" ]; then
  if git -C "$MAIN_ROOT" show-ref --verify --quiet "refs/heads/$branch"; then
    read -r -p "ブランチ '$branch' も削除しますか？ (y/N): " del
    if [[ "$del" == "y" || "$del" == "Y" ]]; then
      git -C "$MAIN_ROOT" branch -D "$branch"
      echo "✅ ブランチ削除: $branch"
    fi
  fi
fi

echo "✅ clean 完了"
git -C "$MAIN_ROOT" worktree list
'''

# 使い方:
# cd ~/my-project/civil-war-like
# mise run wt:setup                  # 固定 path ~/my-worktree-civil-war-like（from main）
# mise run wt:setup-append-branch    # 既存 experimental 先端から別 path + 新 branch
# mise run wt:grok                   # 固定 path 向け Grok
# cd ~/my-worktree-civil-war-like && mise run wt:grok
# mise run wt:clean                  # 固定 path のみ削除（htdp の ~/my-worktree は触らない）
#
# path 対応:
#   本リポ固定   = ~/my-worktree-civil-war-like
#   htdp 固定    = ~/my-worktree          （別リポ・共存可）
#   append 例    = ~/my-worktree-civil-war-like-20260722-feat

# ---------------------------------------------------------------------------
# Phase 0 — ゲーム本体ビルド（Makefile なし・mise に集約）
#   mise install     # または mise run deps
#   mise run compile # g++ 直叩き
#   mise run smoke   # 自動終了スモーク
#   mise run build   # コンパイル + Hello ウィンドウ（完了条件）
#   mise run clean
# ---------------------------------------------------------------------------

[tasks.deps]
description = "mise tools をインストール（g++ 15.2 / raylib 5.5）"
run = "mise install"

[tasks.compile]
description = "civil-war-like を g++ 直叩きでコンパイル（ウィンドウは起動しない）"
depends = ["deps"]
shell = "bash -c"
run = '''
set -euo pipefail

ROOT="$(pwd)"
BIN_DIR="${ROOT}/build"
TARGET="${BIN_DIR}/civil-war-like"
SRC="${ROOT}/src/main.cpp"

# tools 解決（mise tools で固定した backend フル名）
RAYLIB_HOME="${RAYLIB_HOME:-$(mise where github:raysan5/raylib)}"
GXX_HOME="${GXX_HOME:-$(mise where github:xpack-dev-tools/gcc-xpack)}"
CXX="${CXX:-${GXX_HOME}/bin/g++}"

if [[ ! -x "$CXX" ]]; then
  echo "❌ g++ not found at: $CXX  (mise install を実行してください)"
  exit 1
fi
if [[ ! -f "${RAYLIB_HOME}/include/raylib.h" ]]; then
  echo "❌ raylib headers missing under: $RAYLIB_HOME"
  exit 1
fi
if [[ ! -f "${RAYLIB_HOME}/lib/libraylib.a" ]]; then
  echo "❌ libraylib.a missing under: $RAYLIB_HOME/lib"
  exit 1
fi

# 固定バージョン確認（ドリフト検知）
CXX_VER="$("$CXX" -dumpfullversion 2>/dev/null || "$CXX" -dumpversion)"
echo "ℹ️  CXX=$CXX ($CXX_VER)"
echo "ℹ️  RAYLIB_HOME=$RAYLIB_HOME"
case "$CXX_VER" in
  15.2*) ;;
  *)
    echo "❌ expected g++ 15.2.x (xpack), got: $CXX_VER"
    exit 1
    ;;
esac

mkdir -p "$BIN_DIR"

# システム OpenGL/X11（-dev 無しホスト向けに versioned .so を直指定）
SYS_LIBS=(
  -lm -lpthread -ldl
  /lib/x86_64-linux-gnu/libGLX.so.0
  /lib/x86_64-linux-gnu/libX11.so.6
  /lib/x86_64-linux-gnu/libGLdispatch.so.0
)

"$CXX" -std=c++17 -Wall -Wextra -O2 \
  -I"${RAYLIB_HOME}/include" \
  -o "$TARGET" \
  "$SRC" \
  "${RAYLIB_HOME}/lib/libraylib.a" \
  "${SYS_LIBS[@]}"

echo "✅ built $TARGET"
'''

[tasks.build]
description = "ビルド後に Hello ウィンドウを起動（Phase 0 完了条件）"
depends = ["compile"]
run = "./build/civil-war-like"

[tasks.smoke]
description = "ビルド後に短時間だけ起動して自動終了"
depends = ["compile"]
run = "CIVIL_WAR_LIKE_SMOKE=1 ./build/civil-war-like --smoke"

[tasks.clean]
description = "ビルド成果物を削除（mise tools は残す）"
run = "rm -rf build"
